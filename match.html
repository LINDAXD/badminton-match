                          <div className="bg-stone-50 rounded-xl p-2.5">
                            <p className="text-[11px] text-stone-400 mb-1">🔜 다음 경기 예약됨</p>
                            <p className="text-xs text-stone-600">{m.next.teamA[0].name}·{m.next.teamA[1].name} <span className="text-stone-300">vs</span> {m.next.teamB[0].name}·{m.next.teamB[1].name}</p>
                            {(() => {
                              // 예약된 사람 중 "곧 끝날 경기"에서 아직 뛰고 있는 사람이 있으면, 그 경기(코트)가 끝나야 시작된다고 알려줘요
                              const queuedIds = [...m.next.teamA, ...m.next.teamB].map((p) => p.id);
                              const depCourt = Object.entries(courtMatches).find(([cn, cm]) =>
                                Number(cn) !== courtNum && cm && !cm.done && [...cm.teamA, ...cm.teamB].some((p) => queuedIds.includes(p.id))
                              );
                              return depCourt ? (
                                <p className="text-[11px] mt-1" style={{ color: "#B98900" }}>⏳ 코트 {depCourt[0]} 경기가 끝나야 시작돼요. 너무 오래 걸리면 예약을 취소하고 다시 정할 수 있어요.</p>
                              ) : null;
                            })()}
                            {(adminOn || m.next.teamA.some((p) => p.id === myId) || m.next.teamB.some((p) => p.id === myId)) && (
                              <button onClick={() => cancelQueuedNext(courtNum)} className="text-[11px] text-stone-400 underline underline-offset-2 mt-1">예약 취소</button>
                            )}
                          </div>
                        ) : extendedPoolCount >= 4 && (
                          <button
                            onClick={() => queueNextMatch(courtNum)}
                            disabled={queueBusy === courtNum}
                            className="w-full rounded-xl py-2 text-xs font-semibold border disabled:opacity-60"
                            style={{ borderColor: "#4CAF50", color: "#2E7D32" }}
                          >
                            {queueBusy === courtNum ? "정하는 중..." : "🔜 다음 경기 미리 정하기"}
                          </button>
                        )}

                        {adminOn && (
                          <div className="pt-1">
                            <button
                              onClick={() => setExpandedTools((t) => ({ ...t, [courtNum]: !t[courtNum] }))}
                              className="w-full text-center text-[11px] text-stone-400 py-1"
                            >
                              {expandedTools[courtNum] ? "관리자 도구 접기 ▲" : "⚙️ 관리자 도구 더보기 ▼"}
                            </button>
                            {expandedTools[courtNum] && (
                              <div className="space-y-2 mt-1">
                                <button onClick={() => reshuffleCourt(courtNum)} className="w-full py-2 text-xs font-semibold border border-stone-200 text-stone-500 rounded-xl">
                                  🔀 팀 다시 섞기
                                </button>
                                <button
                                  onClick={() => setEditingCourt(editingCourt === courtNum ? null : courtNum)}
                                  className="w-full py-2 text-xs font-semibold border border-stone-200 text-stone-500 rounded-xl"
                                >
                                  ✏️ 잘못 들어간 선수 바꾸기
                                </button>
                                {editingCourt === courtNum && (
                                  <div className="bg-stone-50 rounded-xl p-2.5 space-y-1.5">
                                    {[...m.teamA, ...m.teamB].map((p) => (
                                      <div key={p.id} className="flex items-center gap-2">
                                        <span className="text-xs text-stone-600 w-16 truncate shrink-0">{p.name}</span>
                                        <span className="text-stone-300 text-xs">→</span>
                                        <select
                                          onChange={(e) => {
                                            const val = e.target.value;
                                            if (!val) return;
                                            if (val.startsWith("wait:")) {
                                              swapPlayerInMatch(courtNum, p.id, val.slice(5));
                                            } else if (val.startsWith("court:")) {
                                              const [, otherCourt, otherPlayerId] = val.split(":");
                                              swapPlayerAcrossCourts(courtNum, p.id, Number(otherCourt), otherPlayerId);
                                            }
                                          }}
                                          defaultValue=""
                                          className="flex-1 text-xs border border-stone-200 rounded-lg px-2 py-1"
                                        >
                                          <option value="">다른 사람으로 교체...</option>
                                          {waitingPlayers.length > 0 && (
                                            <optgroup label="대기 중">
                                              {waitingPlayers.map((wp) => (
                                                <option key={wp.id} value={`wait:${wp.id}`}>{wp.name}</option>
                                              ))}
                                            </optgroup>
                                          )}
                                          {Object.entries(courtMatches)
                                            .filter(([cn, cm]) => Number(cn) !== courtNum && cm && !cm.done && cm.date === todayStr())
                                            .map(([cn, cm]) => (
                                              <optgroup key={cn} label={`코트 ${cn}에서 뛰는 중 (자리 맞바꿈)`}>
                                                {[...cm.teamA, ...cm.teamB].map((op) => (
                                                  <option key={op.id} value={`court:${cn}:${op.id}`}>{op.name}</option>
                                                ))}
                                              </optgroup>
                                            ))}
                                        </select>
                                      </div>
                                    ))}
                                    {waitingPlayers.length === 0 && Object.values(courtMatches).filter((cm) => cm && !cm.done && cm.date === todayStr()).length <= 1 && (
                                      <p className="text-[11px] text-stone-400 text-center py-1">지금 바꿀 수 있는 사람이 없어요.</p>
                                    )}
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    ) : meetingEndedToday ? (
                      <div className="px-4 pb-4">
                        <p className="text-xs text-stone-400 text-center">🏁 오늘 모임이 종료됐어요.</p>
                      </div>
                    ) : !adminOn ? (
                      <div className="px-4 pb-4 space-y-2">
                        <p className="text-xs text-stone-400 text-center">경기가 끝났어요.</p>
                        {waitingPlayers.length < 4 && (
                          <p className="text-xs font-medium text-center" style={{ color: "#B98900" }}>
                            ⚠️ {4 - waitingPlayers.length}명이 더 필요해요 (대기 {waitingPlayers.length}명 / 4명)
                          </p>
                        )}
                        <button
                          onClick={() => startRandomMatchAsMember(courtNum)}
                          disabled={randomBusy === courtNum || waitingPlayers.length < 4}
                          className="w-full rounded-xl py-2.5 font-semibold text-sm active:scale-[0.98] transition disabled:opacity-40 disabled:bg-stone-200 disabled:text-stone-400"
                          style={waitingPlayers.length >= 4 ? { backgroundColor: "#FFD54F", color: "#5c4a00" } : {}}
                        >
                          {randomBusy === courtNum ? "생성 중..." : "🎲 랜덤 매칭으로 시작"}
                        </button>
                      </div>
                    ) : !isManualHere ? (
                      <div className="px-4 pb-4 space-y-2">
                        {waitingPlayers.length < 4 && (
                          <p className="text-xs font-medium text-center" style={{ color: "#B98900" }}>
                            ⚠️ {4 - waitingPlayers.length}명이 부족해요. (대기 {waitingPlayers.length}명 / 4명 필요)
                          </p>
                        )}
                        <button
                          onClick={() => startMatchOnCourt(courtNum)}
                          disabled={waitingPlayers.length < 4}
                          className="w-full py-2.5 text-sm font-semibold bg-[#4CAF50] text-white rounded-xl disabled:bg-stone-200 disabled:text-stone-400"
                        >
                          🔀 이 코트 다음 경기 시작
                        </button>
                        <button
                          onClick={() => openManualPick(courtNum)}
                          className="w-full rounded-xl py-2 text-xs font-semibold border"
                          style={{ borderColor: "#FFD54F", color: "#B98900" }}
                        >
                          ✋ 직접 4명 선택해서 시작
                        </button>
                      </div>
                    ) : (
                      <div className="px-4 pb-4">
                        <ManualPicker
                          waitingPlayers={pickablePlayers}
                          selected={manualSelected}
                          onToggle={toggleManualPick}
                          onConfirm={() => confirmManualStart(courtNum)}
                        onAutoFill={() => autoFillAndStart(courtNum)}
                          onCancel={cancelManualPick}
                          pinnedPair={pinnedPair}
                          onTogglePin={togglePin}
                        />
                      </div>
                    )}
                  </>
                )}
              </div>
            );
          })}

          <div className="bc-card p-4">
            <p className="text-xs font-semibold text-stone-500 mb-1">다음 경기는 쉴래요</p>
            <p className="text-xs text-stone-400 mb-2">본인 이름은 언제든 누를 수 있고, 관리자는 다른 사람 대신 눌러줄 수도 있어요. 누르면 다음 경기 시작할 때 대기 명단에서 빠져요. 아래 목록은 관리자를 포함해 모두에게 실시간으로 보여요.</p>
            {Object.keys(restWish).length > 0 && (
              <p className="text-xs font-semibold mb-2" style={{ color: "#4CAF50" }}>
                ✋ 쉬고 싶어하는 사람: {players.filter((p) => restWish[p.id]).map((p) => p.name).join(", ") || "-"}
              </p>
            )}
            <div className="flex flex-wrap gap-2">
              {players.map((p) => {
                const wantsRest = !!restWish[p.id];
                const isMe = p.id === myId;
                const canToggle = isMe || adminOn;
                return (
                  <button
                    key={p.id}
                    disabled={!canToggle}
                    onClick={() => toggleRestWish(p.id)}
                    className={`px-3 py-1.5 rounded-full text-xs border transition ${
                      wantsRest ? "bg-stone-800 text-white border-stone-800" : "bg-stone-50 text-stone-500 border-stone-200"
                    } ${!canToggle ? "opacity-40 cursor-not-allowed" : ""}`}
                  >
                    {p.name} {wantsRest ? "· 쉼" : ""}
                  </button>
                );
              })}
            </div>
          </div>
        </section>
      )}

      {tab === "record" && (
        <section className="px-5 mt-5 space-y-5">
          <div>
            <p className="text-sm font-semibold mb-2">🏆 통산 순위</p>
            <p className="text-[11px] text-stone-400 mb-2">기록은 저장돼서 새로고침해도 사라지지 않아요.</p>
            <ul className="space-y-2">
              {[...players]
                .map((p) => ({ ...p, stats: lifetimeStatsFor(p.id) }))
                .sort((a, b) => b.stats.wins - a.stats.wins || b.stats.games - a.stats.games)
                .map((p, i) => (
                  <li key={p.id} className="bc-card px-4 py-3 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <span className="scorefont text-sm text-stone-400 w-4">{i + 1}</span>
                      <span className="text-sm font-medium">{p.name}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="scorefont text-sm text-stone-500">{p.stats.wins}승 {p.stats.losses}패</span>
                      {adminOn && (
                        <button onClick={() => correctPlayerStats(p)} className="text-[11px] text-stone-400 underline underline-offset-2">
                          수정
                        </button>
                      )}
                    </div>
                  </li>
                ))}
              {players.length === 0 && (
                <p className="text-sm text-stone-400 bg-white rounded-2xl p-5 text-center border border-dashed border-stone-300">
                  참석자를 먼저 등록해주세요.
                </p>
              )}
            </ul>
          </div>

          <div>
            <p className="text-sm font-semibold mb-2">📋 경기 기록</p>
            <p className="text-[11px] text-stone-400 mb-2">저장돼서 새로고침해도 안 사라져요.</p>
            {matchhistory.length === 0 ? (
              <p className="text-sm text-stone-400 bg-white rounded-2xl p-5 text-center border border-dashed border-stone-300">
                아직 종료된 경기가 없어요.
              </p>
            ) : (
              <ul className="space-y-2">
                {matchhistory.slice(0, 50).map((m) => (
                  <li key={m.id} className="bc-card px-4 py-3 text-sm">
                    <div className="flex items-center justify-between mb-1">
                      <p className="text-[11px] text-stone-400">{m.date} · Court {m.court}</p>
                      {adminOn && (
                        <button onClick={() => deleteMatchRecord(m)} className="text-[11px] text-red-400 underline underline-offset-2">삭제</button>
                      )}
                    </div>
                    <div className="flex justify-between items-center gap-2">
                      <span className="truncate">{m.teamA[0].name}·{m.teamA[1].name}</span>
                      {adminOn ? (
                        <div className="flex items-center gap-1.5 shrink-0">
                          <NumberSelect value={m.scoreA === "" ? null : Number(m.scoreA)} onChange={(v) => editMatchRecord(m, "scoreA", v == null ? "" : String(v))} max={30} placeholder="-" unit="" />
                          <span className="text-stone-400">:</span>
                          <NumberSelect value={m.scoreB === "" ? null : Number(m.scoreB)} onChange={(v) => editMatchRecord(m, "scoreB", v == null ? "" : String(v))} max={30} placeholder="-" unit="" />
                        </div>
                      ) : (
                        <span className="scorefont font-semibold shrink-0">{m.scoreA} : {m.scoreB}</span>
                      )}
                      <span className="truncate text-right">{m.teamB[0].name}·{m.teamB[1].name}</span>
                    </div>
                  </li>
                ))}
              </ul>
            )}
          </div>
        </section>
      )}

      <BottomNav active="match" />
      <AppModalHost />
    </div>
    </RequireLogin>
  );
}

window.authReadyPromise.then(() => {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script>
</body>
</html>
