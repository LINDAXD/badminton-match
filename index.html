<script type="text/babel">
const QUOTES = [
  "실수해도 괜찮아요, 오늘도 나가서 뛰는 게 승리예요.",
  "라켓을 처음 잡던 그날의 설렘을 기억하세요.",
  "혼자 치는 스매시보다, 함께 웃는 랠리가 더 오래 남아요.",
  "잘 치는 것보다 즐겁게 치는 게 먼저예요.",
  "오늘 흘린 땀이 다음 랠리를 더 즐겁게 만들어줘요.",
  "같이 뛰는 사람이 있다는 것, 그게 버디이에요.",
];
function quoteOfToday() {
  const day = new Date().getDate();
  return QUOTES[day % QUOTES.length];
}

function MyBirthdayField({ me, onSave }) {
  const [val, setVal] = React.useState(() => birthdayToInputVal(me));
  const [msg, setMsg] = React.useState("");
  React.useEffect(() => {
    setVal(birthdayToInputVal(me));
  }, [me && me.id]);

  // 연도(birthYear)까지 저장돼 있으면 6자리로 미리 채워주고, 옛날에 4자리로만 등록했던 경우엔 다시 6자리로 입력받아요.
  function birthdayToInputVal(m) {
    if (m && m.birthYear && m.birthday && m.birthday.length === 4) {
      return `${String(m.birthYear).slice(2, 4)}${m.birthday}`;
    }
    return "";
  }

  function save() {
    const digits = val.replace(/\D/g, "");
    if (digits.length !== 6) {
      setMsg("생년월일 6자리로 입력해주세요 (예: 000000)");
      return;
    }
    const mmdd = digits.slice(2, 6); // YYMMDD → 뒤 4자리(MMDD)는 저장, 앞 2자리(YY)는 연도로 변환해서 따로 저장
    const yy = parseInt(digits.slice(0, 2), 10);
    const nowYY = new Date().getFullYear() % 100;
    const birthYear = yy > nowYY ? 1900 + yy : 2000 + yy;
    const mm = parseInt(mmdd.slice(0, 2), 10);
    const dd = parseInt(mmdd.slice(2, 4), 10);
    if (mm < 1 || mm > 12 || dd < 1 || dd > 31) { setMsg("월/일을 다시 확인해주세요."); return; }
    onSave(mmdd, birthYear);
    setVal(digits);
    setMsg("생일이 등록됐어요! 🎂");
    setTimeout(() => setMsg(""), 2500);
  }

  return (
    <div>
      <div className="flex items-center gap-2 flex-wrap">
        <span className="text-[11px] text-stone-400 shrink-0">🎂 내 생일</span>
        <input
          type="tel"
          inputMode="numeric"
          value={val}
          onChange={(e) => { setVal(e.target.value.replace(/\D/g, "").slice(0, 6)); if (msg) setMsg(""); }}
          placeholder="000000"
          className="text-xs border border-stone-200 rounded-lg px-2 py-1.5 w-20 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
        <button onClick={save} className="text-[11px] text-[var(--bc-navy)] font-semibold rounded-lg px-3 py-1.5 shrink-0" style={{ backgroundColor: "var(--bc-blue)" }}>
          저장
        </button>
        {me && me.birthday && !msg && (
          <span className="text-[11px] text-stone-400">현재 {fmtBirthday(me.birthday)}로 등록됨</span>
        )}
      </div>
      <p className="text-[11px] text-stone-300 mt-1">생년월일 6자리로 입력해주세요 (예: 000000). 연도는 관리자만 볼 수 있어요.</p>
      {msg && <p className="text-[11px] mt-1" style={{ color: msg.includes("등록됐") ? "var(--bc-blue)" : "#dc2626" }}>{msg}</p>}
    </div>
  );
}

// 생일/환영/월간 수상 소식이 한꺼번에 여러 개 쌓여도 정신없지 않게, 한 줄씩 돌아가면서 보여줘요.
function RotatingBanner({ items }) {
  const [idx, setIdx] = React.useState(0);
  React.useEffect(() => {
    if (items.length <= 1) return;
    const t = setInterval(() => setIdx((i) => (i + 1) % items.length), 5000);
    return () => clearInterval(t);
  }, [items.length, idx]);
  if (items.length === 0) return null;
  const it = items[idx % items.length];
  const go = (delta) => setIdx((i) => (i + delta + items.length) % items.length);
  return (
    <section className="px-5 pt-3 max-w-2xl mx-auto">
      <div className="rise-in rounded-2xl p-3.5" style={{ backgroundColor: "#FFFBEA", border: "1px solid #FFD54F" }}>
        <div className="flex items-center gap-2">
          {items.length > 1 && (
            <button onClick={() => go(-1)} className="shrink-0 text-lg px-1 tap-scale" style={{ color: "#D9BF6B" }}>‹</button>
          )}
          <p className="text-sm font-bold text-center flex-1" style={{ color: "#B98900" }}>
            {it.emoji} {it.text}
          </p>
          {items.length > 1 && (
            <button onClick={() => go(1)} className="shrink-0 text-lg px-1 tap-scale" style={{ color: "#D9BF6B" }}>›</button>
          )}
        </div>
        {items.length > 1 && (
          <div className="flex items-center justify-center gap-1.5 mt-2">
            {items.map((_, i) => (
              <button key={i} onClick={() => setIdx(i)} className="rounded-full tap-scale" style={{ width: 6, height: 6, backgroundColor: i === idx ? "#B98900" : "#F0E0A8" }} />
            ))}
          </div>
        )}
      </div>
    </section>
  );
}

function App() {
  const { myId, myName, login, logout } = useIdentity();
  const { roster, ready: rosterReady } = useRoster();
  const [loginInput, setLoginInput] = React.useState("");
  const [signupLevel, setSignupLevel] = React.useState("초보");
  const [showMySettings, setShowMySettings] = React.useState(false);
  const [showLoginModal, setShowLoginModal] = React.useState(false);
  const [loginMsg, setLoginMsg] = React.useState("");
  const [rsvp, setRsvp] = React.useState({});
  const [notices, setNotices] = React.useState([]);
  const [noticesReady, setNoticesReady] = React.useState(false);
  const [schedule, setSchedule] = React.useState([]);
  const [reviews, setReviews] = React.useState([]);
  const [reviewsReady, setReviewsReady] = React.useState(false);
  const [checkedInMsg, setCheckedInMsg] = React.useState("");
  const [paymentInfo, setPaymentInfo] = React.useState(null);
  const [payments, setPayments] = React.useState({});
  const [pending, setPending] = React.useState([]);
  const [checkinlog, setCheckinlog] = React.useState([]);
  const [dailyvotesDoc, setDailyvotesDoc] = React.useState({});
  const [courtMatches, setCourtMatches] = React.useState({});
  const [matchhistory, setMatchhistory] = React.useState([]);

  React.useEffect(() => {
    const unsub = REFS.matchhistory.onSnapshot((snap) => {
      const data = snap.data();
      setMatchhistory(data && data.items ? data.items : []);
    }, () => {});
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.courtmatches.onSnapshot((snap) => {
      const data = snap.data();
      setCourtMatches(data && data.data ? data.data : {});
    }, () => {});
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.dailyvotes.onSnapshot((snap) => {
      const data = snap.data();
      setDailyvotesDoc(data && data.data ? data.data : {});
    }, () => {});
    return () => unsub();
  }, []);

  const [meetingEndedDate, setMeetingEndedDate] = React.useState(null);
  React.useEffect(() => {
    const unsub = REFS.matchmode.onSnapshot((snap) => {
      const data = snap.data();
      setMeetingEndedDate((data && data.meetingEndedDate) || null);
    }, () => {});
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.pending.onSnapshot((snap) => {
      const data = snap.data();
      setPending(data && data.items ? data.items : []);
    }, () => {});
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.checkinlog.onSnapshot((snap) => {
      const data = snap.data();
      setCheckinlog(data && data.items ? data.items : []);
    }, () => {});
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.paymentinfo.onSnapshot((snap) => {
      const data = snap.data();
      setPaymentInfo(data && data.bank ? data : null);
    }, () => {});
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.payments.onSnapshot((snap) => {
      const data = snap.data();
      const all = data && data.data ? data.data : {};
      setPayments(all[todayStr()] || {});
    }, () => {});
    return () => unsub();
  }, []);

  function togglePaid() {
    if (!myId) return;
    const paidNow = !payments[myId];
    const next = { ...payments, [myId]: paidNow ? { paid: true, at: new Date().toISOString() } : undefined };
    if (!paidNow) delete next[myId];
    setPayments(next);
    REFS.payments.get().then((snap) => {
      const data = snap.data() || {};
      const all = data.data || {};
      all[todayStr()] = next;
      REFS.payments.set({ data: all }).catch(() => {});
    }).catch(() => {});
  }


  React.useEffect(() => {
    const unsub = REFS.checkin.onSnapshot((snap) => {
      const data = snap.data();
      setRsvp(data && data.data ? data.data : {});
    });
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.notices.onSnapshot((snap) => {
      const data = snap.data();
      setNotices(data && data.items ? data.items : []);
      setNoticesReady(true);
    }, () => setNoticesReady(true));
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.schedule.onSnapshot((snap) => {
      const data = snap.data();
      setSchedule(data && data.items ? data.items : []);
    });
    return () => unsub();
  }, []);

  React.useEffect(() => {
    const unsub = REFS.reviews.onSnapshot((snap) => {
      const data = snap.data();
      setReviews(data && data.items ? data.items : []);
      setReviewsReady(true);
    }, () => setReviewsReady(true));
    return () => unsub();
  }, []);

  async function doLogin() {
    const name = loginInput.trim();
    if (!name) { setLoginMsg("이름을 입력해주세요."); return; }
    if (!rosterReady) { setLoginMsg("회원 명단을 불러오는 중이에요. 잠시 후 다시 눌러주세요."); return; }
    // 한글은 기기/키보드에 따라 눈에는 똑같아 보여도 내부 코드가 미세하게 다르게 저장될 수 있어서(정규화 차이),
    // 양쪽 다 표준 형태로 맞춰서 비교해요 — 이래야 "이미 있는 이름인데 처음 왔다고 뜨는" 문제가 확실히 없어져요.
    const normalizedName = name.normalize("NFC");
    const existing = roster.find((m) => (m.name || "").trim().normalize("NFC") === normalizedName);
    if (existing) {
      if (existing.pin) {
        const pin = await appPrompt(`${name}님, 본인 확인을 위해 비밀번호(숫자 4자리)를 입력해주세요.`, "", { password: true });
        if (pin === null) return;
        if (pin !== existing.pin) {
          setLoginMsg("비밀번호가 일치하지 않아요. 본인이 아니라면 입장할 수 없어요.");
          return;
        }
        login(existing.id, existing.name);
        setShowLoginModal(false);
      } else {
        const pin = await appPrompt(`${name}님, 처음이시네요! 앞으로 본인 확인에 쓸 비밀번호를 설정해주세요.\n(반드시 숫자 4자리로만 입력해주세요. 예: 0524)`, "", { password: true });
        if (pin === null) return;
        if (!/^\d{4}$/.test(pin)) { setLoginMsg("비밀번호는 숫자 4자리로만 설정할 수 있어요. 더 길거나 짧으면 안 돼요."); return; }
        const next = roster.map((m) => (m.id === existing.id ? { ...m, pin } : m));
        REFS.roster.set({ members: next }).catch(() => {});
        login(existing.id, existing.name);
        setShowLoginModal(false);
        setLoginMsg("비밀번호가 설정됐어요. 다음부턴 이 비밀번호로 입장해주세요.");
      }
    } else {
      const alreadyPending = pending.some((p) => (p.name || "").normalize("NFC") === normalizedName);
      if (alreadyPending) {
        setLoginMsg("이미 관리자 승인을 기다리고 있는 이름이에요. 승인되면 로그인할 수 있어요.");
        setLoginInput("");
        return;
      }
      const pin = await appPrompt(`${name}님, 처음 오셨네요! 앞으로 본인 확인에 쓸 비밀번호를 설정해주세요.\n(반드시 숫자 4자리로만 입력해주세요. 예: 0524)`, "", { password: true });
      if (pin === null) return;
      if (!/^\d{4}$/.test(pin)) { setLoginMsg("비밀번호는 숫자 4자리로만 설정할 수 있어요. 더 길거나 짧으면 안 돼요."); return; }
      const req = { id: uid(), name, pin, level: signupLevel, requestedAt: todayStr() };
      REFS.pending.set({ items: [...pending, req] }).catch(() => {});
      setLoginMsg("가입 신청됐어요! 관리자 승인 후 이 이름과 비밀번호로 로그인할 수 있어요. 🙏");
    }
    setLoginInput("");
  }

  const me = roster.find((m) => m.id === myId);

  function updateMyBirthday(birthday, birthYear) {
    const next = roster.map((m) => (m.id === myId ? { ...m, birthday, ...(birthYear ? { birthYear } : {}) } : m));
    REFS.roster.set({ members: next }).catch(() => {});
  }

  function updateMyLevel(level) {
    const next = roster.map((m) => (m.id === myId ? { ...m, level } : m));
    REFS.roster.set({ members: next }).catch(() => {});
  }

  async function changeMyPin() {
    if (!me) return;
    const current = await appPrompt("현재 비밀번호를 입력해주세요.", "", { password: true });
    if (current === null) return;
    if (current !== (me.pin || "")) {
      appAlert("현재 비밀번호가 일치하지 않아요.");
      return;
    }
    const next1 = await appPrompt("새 비밀번호를 입력해주세요.\n(반드시 숫자 4자리로만 입력해주세요. 예: 0524)", "", { password: true });
    if (next1 === null) return;
    if (!/^\d{4}$/.test(next1)) { appAlert("비밀번호는 숫자 4자리로만 설정할 수 있어요. 더 길거나 짧으면 안 돼요."); return; }
    const next = roster.map((m) => (m.id === myId ? { ...m, pin: next1 } : m));
    REFS.roster.set({ members: next }).catch(() => {});
    appAlert("비밀번호가 변경됐어요.");
  }

  const pinned = notices.find((n) => n.pinned);
  const preview = pinned || notices[0];
  const upcomingList = [...schedule]
    .filter((s) => s.date >= todayStr())
    .sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")))
    .slice(0, 3);
  const nextMeeting = upcomingList[0];
  const attendanceSource = getEffectiveAttendanceEvents(schedule);
  const attendingMembers = combinedTodayAttendees(schedule, checkinlog, roster).map((a) => roster.find((m) => m.id === a.id) || a);
  const attendCount = attendingMembers.length;
  const isRealToday = attendanceSource.length > 0 && attendanceSource[0].date === todayStr();
  // "출석"(오늘 진짜 체크인)이랑 "참석 예정"(다음 모임에 미리 참석 눌러둔 것)은 서로 다른 개념이라 구분해서 보여줘요.
  const iAmInAttendanceSource = myId && attendingMembers.some((m) => m.id === myId);
  const myStatusText = !iAmInAttendanceSource ? null
    : isRealToday ? "✅ 오늘 참석으로 체크되어 있어요"
    : attendanceSource.length > 0 ? `📅 ${fmtDate(attendanceSource[0].date)} 모임에 참석 예정이에요`
    : "✅ 참석으로 체크되어 있어요";
  const latestPhoto = reviews.find((r) => photosOf(r).length >= 3);
  function isFirstTimer(id) {
    return checkinlog.filter((c) => c.memberId === id).length <= 1;
  }
  const birthdayMembers = roster.filter((m) => m.birthday && m.birthday === todayMD());
  const newMembersToday = roster.filter((m) => m.joinedAt === todayStr());

  // 🏸 오늘 운영 — 운영자가 매칭 페이지 안 열어도 홈에서 바로 상황 파악할 수 있게
  const activeCourts = Object.values(courtMatches).filter((m) => m && !m.done).length;
  const occupiedIds = new Set();
  Object.values(courtMatches).forEach((m) => { if (m && !m.done) [...m.teamA, ...m.teamB].forEach((p) => occupiedIds.add(p.id)); });
  const waitingNow = attendingMembers.filter((m) => !occupiedIds.has(m.id));
  const nextUp = waitingNow.slice(0, 2);

  // 내가 지금 뛰고 있는 코트가 있으면 찾아서 홈에서 바로 보여줘요 (매칭 화면까지 안 들어가도 알 수 있게)
  let myCourtInfo = null;
  if (myId) {
    for (const [courtNum, m] of Object.entries(courtMatches)) {
      if (!m || m.done || m.date !== todayStr()) continue;
      const inA = (m.teamA || []).some((p) => p.id === myId);
      const inB = (m.teamB || []).some((p) => p.id === myId);
      if (inA || inB) {
        const mine = inA ? m.teamA : m.teamB;
        const opp = inA ? m.teamB : m.teamA;
        myCourtInfo = {
          court: courtNum,
          teammate: (mine.find((p) => p.id !== myId) || {}).name,
          opponents: opp.map((p) => p.name),
        };
        break;
      }
    }
  }

  // 내 기록 요약 (실력점수/급수/승률/총경기) — 매칭 화면과 같은 계산 방식
  function matchWinnerSide(m) {
    if (m.winner === "A" || m.winner === "B") return m.winner;
    const sA = Number(m.scoreA), sB = Number(m.scoreB);
    if (m.scoreA === "" || m.scoreB === "" || isNaN(sA) || isNaN(sB) || sA === sB) return null;
    return sA > sB ? "A" : "B";
  }
  function lifetimeStatsFor(id) {
    let games = 0, wins = 0, losses = 0;
    matchhistory.forEach((m) => {
      const inA = (m.teamA || []).some((p) => p.id === id);
      const inB = (m.teamB || []).some((p) => p.id === id);
      if (!inA && !inB) return;
      const side = matchWinnerSide(m);
      if (!side) return;
      games++;
      const won = (inA && side === "A") || (inB && side === "B");
      if (won) wins++; else losses++;
    });
    return { games, wins, losses };
  }
  const myLifetimeStats = myId ? lifetimeStatsFor(myId) : null;
  const myWinRate = myLifetimeStats && myLifetimeStats.games > 0 ? Math.round((myLifetimeStats.wins / myLifetimeStats.games) * 100) : 0;
  const mySkillScore = me ? getSkillScore(me) : null;
  const myStage = myLifetimeStats ? evaluationStage(myLifetimeStats.games) : null;
  const myTier = myLifetimeStats ? tierForScore(mySkillScore, myLifetimeStats.games) : null;
  const myRecentMatches = myId
    ? matchhistory
        .filter((m) => (m.teamA || []).some((p) => p.id === myId) || (m.teamB || []).some((p) => p.id === myId))
        .filter((m) => matchWinnerSide(m) !== null)
        .slice(0, 3)
        .map((m) => {
          const inA = (m.teamA || []).some((p) => p.id === myId);
          const side = matchWinnerSide(m);
          const won = (inA && side === "A") || (!inA && side === "B");
          return { id: m.id, date: m.date, won };
        })
    : [];

  return (
    <div className="min-h-screen pb-24 font-sans" style={{ backgroundColor: "#F7F8FA", color: "#2A2A28" }}>
      {/* top greeting card — 흰 카드 + 얇은 네이비 포인트만, 화면 전체를 색으로 덮지 않게 */}
      <header className="px-5 pt-6 pb-5 max-w-2xl mx-auto">
        <div className="rise-in bc-card p-5 relative overflow-hidden">
          <div className="absolute top-0 left-0 right-0 h-1" style={{ backgroundColor: "var(--bc-navy)" }} />
          <div className="flex items-center justify-between mb-4">
            <div>
              <p className="headfont text-[22px] leading-tight text-stone-800">
                {myId ? <>안녕하세요, {myName}님 👋</> : "혼자보다 함께, 버디"}
              </p>
              <p className="text-[12px] mt-1 text-stone-400">
                {new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" })}
              </p>
            </div>
            {myId ? (
              <button onClick={logout} className="tap-scale text-[11px] font-semibold px-3 py-1.5 rounded-full shrink-0 border" style={{ borderColor: "var(--bc-line)", color: "var(--bc-sub)" }}>
                로그아웃
              </button>
            ) : (
              <button onClick={() => setShowLoginModal(true)} className="tap-scale text-sm font-bold px-4 py-2 rounded-full shrink-0" style={{ backgroundColor: "var(--bc-blue)", color: "var(--bc-navy)" }}>
                🔑 로그인
              </button>
            )}
          </div>

          {myId && isRealToday && attendCount > 0 ? (
            <div className="rounded-2xl p-3.5 grid grid-cols-3 gap-2 text-center" style={{ backgroundColor: "var(--bc-blue-soft)" }}>
              <div>
                <p className="headfont text-xl" style={{ color: "var(--bc-navy)" }}>{attendCount}</p>
                <p className="text-[10px] text-stone-500">오늘 참석</p>
              </div>
              <div>
                <p className="headfont text-xl" style={{ color: "var(--bc-navy)" }}>{activeCourts}</p>
                <p className="text-[10px] text-stone-500">코트 운영중</p>
              </div>
              <div>
                <p className="headfont text-xl" style={{ color: "var(--bc-navy)" }}>{waitingNow.length}</p>
                <p className="text-[10px] text-stone-500">현재 대기</p>
              </div>
            </div>
          ) : myId ? (
            <p className="text-[13px] text-stone-500">오늘도 같이 뛰어요, 우리 버디 🏸</p>
          ) : (
            <button
              onClick={() => setShowLoginModal(true)}
              className="tap-scale w-full text-center text-sm font-bold py-3 rounded-2xl"
              style={{ backgroundColor: "var(--bc-blue)", color: "var(--bc-navy)" }}
            >
              이름으로 입장하기 →
            </button>
          )}

          {myId && isRealToday && attendCount > 0 && nextUp.length > 0 && (
            <p className="text-[11px] mt-2.5 text-stone-500">🔜 다음 추천: {nextUp.map((p) => p.name).join(", ")}</p>
          )}
        </div>

        <div className="flex gap-2 justify-center mt-4">
          <a href="./more.html#create" className="tap-scale flex-1 text-center text-[var(--bc-navy)] text-sm font-bold px-6 py-3.5 rounded-2xl" style={{ backgroundColor: "var(--bc-blue)" }}>
            ➕ 모임 만들기
          </a>
          <a href="./match.html" className="tap-scale flex-1 text-center text-sm font-bold px-6 py-3.5 rounded-2xl border" style={{ borderColor: "var(--bc-line)", color: "var(--bc-sub)" }}>
            🎲 랜덤매칭
          </a>
        </div>
        {myStatusText && (
          <p className="text-xs mt-2.5 text-center" style={{ color: "var(--bc-blue)" }}>{myStatusText}</p>
        )}
      </header>

      {/* 오늘의 소식 (생일/신규회원/이달의 수상자를 한 줄씩 돌아가며 보여줘서 안 정신없게) */}
      {(() => {
        const items = [];
        if (meetingEndedDate === todayStr()) items.push({ emoji: "🏁", text: "오늘 모임이 종료됐어요. 수고하셨어요!" });
        if (birthdayMembers.length > 0) items.push({ emoji: "🎂", text: `오늘은 ${birthdayMembers.map((m) => m.name).join(", ")}님의 생일이에요!` });
        if (newMembersToday.length > 0) items.push({ emoji: "🎉", text: `${newMembersToday.map((m) => m.name).join(", ")}님, 버디에 오신 걸 환영해요!` });
        window.VOTE_CATEGORIES.forEach((cat) => {
          const leader = monthlyLeader(dailyvotesDoc, cat.key, roster);
          if (leader) items.push({ emoji: cat.emoji, text: `이번 달 ${cat.label}은 ${leader.member.name}님이에요! (매월 1일 새로 집계돼요)` });
        });
        return <RotatingBanner items={items} />;
      })()}


      {/* venue rental fee (대관비) */}
      {myId && paymentInfo && isRealToday && iAmInAttendanceSource && (
        <section className="px-5 max-w-2xl mx-auto mb-5">
          <div className="rise-in bc-card p-4">
            <p className="text-sm font-bold text-stone-800 mb-1">💰 오늘 대관비</p>
            <p className="text-xs text-stone-400 mb-3">아래 계좌로 송금 후 완료 버튼을 눌러주세요.</p>
            <div className="bg-stone-50 rounded-xl p-3 mb-3 space-y-1">
              <p className="text-sm"><span className="text-stone-400">은행</span> · <b>{paymentInfo.bank}</b></p>
              <p className="text-sm"><span className="text-stone-400">계좌번호</span> · <b className="scorefont">{paymentInfo.account}</b></p>
              <p className="text-sm"><span className="text-stone-400">예금주</span> · <b>{paymentInfo.holder}</b></p>
              <p className="text-sm"><span className="text-stone-400">금액</span> · <b style={{ color: "var(--bc-blue)" }}>{fmtMoney(paymentInfo.amount)}</b></p>
            </div>
            <button
              onClick={togglePaid}
              className={`w-full rounded-xl py-2.5 text-sm font-semibold tap-scale ${payments[myId] ? "text-white" : "border"}`}
              style={payments[myId] ? { backgroundColor: "var(--bc-blue)" } : { borderColor: "var(--bc-blue)", color: "var(--bc-blue)" }}
            >
              {payments[myId] ? "✅ 송금완료" : "송금완료 눌러주세요"}
            </button>
          </div>
        </section>
      )}

      {/* login card */}
      <section id="login" className="px-5 max-w-2xl mx-auto mb-5">
        {myId && (
        <div className="bc-card p-4">
            <div>
              <div className="flex items-center justify-between">
                <p className="text-sm"><span className="font-bold" style={{ color: "var(--bc-blue)" }}>{myName}</span>님으로 로그인됨</p>
                <div className="flex items-center gap-3">
                  <button onClick={() => setShowMySettings((v) => !v)} className="text-[11px] text-stone-400 underline underline-offset-2">
                    {showMySettings ? "설정 접기" : "내 설정"}
                  </button>
                  <button onClick={logout} className="text-xs text-stone-400 underline underline-offset-2">로그아웃</button>
                </div>
              </div>
              {showMySettings && (
                <div className="mt-3 pt-3 border-t border-stone-100 space-y-2">
                  <MyBirthdayField me={me} onSave={updateMyBirthday} />
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] text-stone-400 shrink-0">🏸 내 레벨</span>
                    <select
                      value={(me && me.level) || "초보"}
                      onChange={(e) => updateMyLevel(e.target.value)}
                      className="text-xs border border-stone-200 rounded-lg px-2 py-1.5"
                    >
                      {window.LEVELS.map((lv) => (
                        <option key={lv} value={lv}>{lv}</option>
                      ))}
                    </select>
                  </div>
                  <div className="flex items-center gap-3">
                    <button onClick={changeMyPin} className="text-[11px] text-stone-400 underline underline-offset-2">
                      🔑 비밀번호 변경
                    </button>
                  </div>
                </div>
              )}
            </div>
        </div>
        )}
      </section>

      {showLoginModal && !myId && (
        <div className="fixed inset-0 bg-black/50 z-[90] flex items-center justify-center px-6" onClick={() => setShowLoginModal(false)}>
          <div className="bg-white rounded-2xl p-5 w-full max-w-sm rise-in" onClick={(e) => e.stopPropagation()}>
            <p className="text-sm font-bold text-stone-800 mb-1">🏸 이름으로 입장하기</p>
            <p className="text-xs text-stone-400 mb-3">기존 멤버는 이름 그대로, 처음이면 가입 신청 후 관리자 승인을 받아요.</p>
            <div className="flex gap-2">
              <input
                autoFocus
                value={loginInput}
                onChange={(e) => { setLoginInput(e.target.value); if (loginMsg) setLoginMsg(""); }}
                onKeyDown={(e) => e.key === "Enter" && doLogin()}
                placeholder="이름 입력"
                className="flex-1 rounded-xl border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2"
                style={{ "--tw-ring-color": "var(--bc-blue)" }}
              />
              <button onClick={doLogin} className="text-[var(--bc-navy)] rounded-xl px-4 text-sm font-semibold tap-scale" style={{ backgroundColor: "var(--bc-blue)" }}>입장</button>
            </div>
            <div className="flex items-center gap-2 mt-3">
              <span className="text-[11px] text-stone-400 shrink-0">처음이면 내 실력</span>
              <select
                value={signupLevel}
                onChange={(e) => setSignupLevel(e.target.value)}
                className="text-xs border border-stone-200 rounded-lg px-2 py-1.5"
              >
                {window.LEVELS.map((lv) => (
                  <option key={lv} value={lv}>{lv}</option>
                ))}
              </select>
            </div>
            {loginMsg && (
              <div
                className="mt-3 rounded-xl p-3 text-sm font-medium"
                style={
                  loginMsg.includes("가입 신청됐어요") || loginMsg.includes("비밀번호가 설정됐어요")
                    ? { backgroundColor: "#EAF1FF", color: "var(--bc-navy)" }
                    : { backgroundColor: "#FFF8E1", color: "#B98900" }
                }
              >
                {loginMsg}
              </div>
            )}
            <p className="text-[10px] text-stone-300 mt-2">🔒 다른 사람의 이름으로는 비밀번호 없이 입장할 수 없어요.</p>
            <button onClick={() => setShowLoginModal(false)} className="mt-4 w-full text-xs text-stone-400 underline underline-offset-2">닫기</button>
          </div>
        </div>
      )}

      {/* upcoming schedule + 참석 인원을 한 카드로 합쳐서 붕 떠보이지 않게 — 참석/미정/불참 버튼을 카드에 바로 넣어서 이동 없이 바로 체크 가능 */}
      <section className="px-5 max-w-2xl mx-auto mb-4">
        <div className="rise-in bc-card p-4">
          <p className="text-[11px] font-semibold text-stone-400 mb-2 tracking-wide">🗓️ 다가오는 모임</p>
          {upcomingList.length === 0 ? (
            <p className="text-sm text-stone-400">예정된 일정이 없어요.</p>
          ) : (
            <>
              <div className="flex items-end justify-between gap-2">
                <div className="min-w-0">
                  <p className="headfont text-2xl text-stone-900">
                    {fmtDate(upcomingList[0].date)}
                    {upcomingList[0].time && <span className="ml-2 text-lg" style={{ color: "var(--bc-blue)" }}>{fmtTime(upcomingList[0].time)}</span>}
                  </p>
                  <p className="text-sm text-stone-500 mt-0.5 truncate">{upcomingList[0].title}{upcomingList[0].location ? ` · ${upcomingList[0].location}` : ""}</p>
                </div>
                <div className="text-right shrink-0">
                  <p className="headfont text-xl" style={{ color: "var(--bc-blue)" }}>{attendCount}<span className="text-xs text-stone-400 font-normal">명</span></p>
                  <p className="text-[10px] text-stone-400">{isRealToday ? "오늘 참석" : "참석 예정"}</p>
                </div>
              </div>

              {myId && (() => {
                const s = upcomingList[0];
                const myStatus = (s.rsvp || []).find((r) => r.id === myId)?.status || null;
                return (
                  <div className="grid grid-cols-3 gap-2 mt-3">
                    <button
                      onClick={() => setRsvpFor(s, "in", myId, myName)}
                      className={`text-xs font-semibold py-2 rounded-xl tap-scale ${myStatus === "in" ? "text-white" : "bg-stone-50 text-stone-500 border border-stone-200"}`}
                      style={myStatus === "in" ? { backgroundColor: "var(--bc-blue)" } : {}}
                    >
                      ✅ 참석
                    </button>
                    <button
                      onClick={() => setRsvpFor(s, "maybe", myId, myName)}
                      className={`text-xs font-semibold py-2 rounded-xl tap-scale ${myStatus === "maybe" ? "text-white" : "bg-stone-50 text-stone-500 border border-stone-200"}`}
                      style={myStatus === "maybe" ? { backgroundColor: "#B98900" } : {}}
                    >
                      ❓ 미정
                    </button>
                    <button
                      onClick={() => setRsvpFor(s, "out", myId, myName)}
                      className={`text-xs font-semibold py-2 rounded-xl tap-scale ${myStatus === "out" ? "text-white" : "bg-stone-50 text-stone-500 border border-stone-200"}`}
                      style={myStatus === "out" ? { backgroundColor: "#C0392B" } : {}}
                    >
                      ❌ 불참
                    </button>
                  </div>
                );
              })()}

              <div className="mt-3 pt-3 border-t border-stone-100">
                {attendingMembers.length === 0 ? (
                  <p className="text-xs text-stone-400">아직 참석한 사람이 없어요.</p>
                ) : (
                  <div className="flex flex-wrap gap-1.5">
                    {attendingMembers.slice(0, 12).map((m) => (
                      isFirstTimer(m.id) ? (
                        <StatusPill key={m.id} tone="green">🌱 {m.name}</StatusPill>
                      ) : (
                        <span key={m.id} className="text-xs bg-stone-50 border border-stone-200 rounded-full px-2.5 py-1 text-stone-600">
                          {m.name}
                        </span>
                      )
                    ))}
                    {attendingMembers.length > 12 && (
                      <span className="text-xs text-stone-400 px-1 py-1">+{attendingMembers.length - 12}명 더</span>
                    )}
                  </div>
                )}
              </div>

              {upcomingList.length > 1 && (
                <ul className="mt-3 pt-3 border-t border-stone-100 space-y-2">
                  {upcomingList.slice(1).map((s) => (
                    <li key={s.id} className="flex items-center justify-between gap-2">
                      <p className="text-sm font-medium text-stone-600 truncate">{s.title}</p>
                      <p className="text-[11px] text-stone-400 shrink-0">
                        {fmtDate(s.date)}{s.time ? ` · ${fmtTime(s.time)}` : ""}
                      </p>
                    </li>
                  ))}
                </ul>
              )}
            </>
          )}
        </div>
      </section>

      {/* ② 오늘의 매칭 — 내가 지금 뛰고 있으면 코트/상대를 바로 보여줘요 */}
      {myId && isRealToday && (
        <section className="px-5 max-w-2xl mx-auto mb-4">
          <div className="bc-card overflow-hidden">
            {myCourtInfo ? (
              <>
                <div className="px-4 py-3 flex items-center justify-between" style={{ backgroundColor: "var(--bc-navy)" }}>
                  <div className="flex items-center gap-2">
                    <span className="text-base">🏸</span>
                    <p className="text-white font-bold text-base">{myCourtInfo.court}코트</p>
                  </div>
                  <span className="bc-badge2 bc-badge2-playing">🟢 게임 진행 중</span>
                </div>
                <div className="px-4 pt-4 pb-4">
                  <div className="rounded-xl p-3 text-center" style={{ backgroundColor: "var(--bc-navy)" }}>
                    <p className="text-[10px] font-bold tracking-widest mb-1 text-white/70">A팀</p>
                    <p className="text-base font-bold text-white">나{myCourtInfo.teammate && <> · {myCourtInfo.teammate}</>}</p>
                  </div>
                  <p className="text-center text-xs text-stone-400 my-1.5 font-bold">VS</p>
                  <div className="rounded-xl p-3 text-center" style={{ backgroundColor: "var(--bc-blue-soft)" }}>
                    <p className="text-[10px] font-bold tracking-widest mb-1" style={{ color: "var(--bc-blue)" }}>B팀</p>
                    <p className="text-base font-bold" style={{ color: "var(--bc-blue)" }}>{myCourtInfo.opponents.join(" · ")}</p>
                  </div>
                  <a href="./match.html" className="bc-btn-lg mt-3 w-full text-sm border" style={{ borderColor: "var(--bc-line)", color: "var(--bc-sub)" }}>
                    매칭 화면에서 보기 →
                  </a>
                </div>
              </>
            ) : (
              <div className="p-4 flex items-center justify-between">
                <div>
                  <p className="text-sm font-semibold text-stone-700">🕒 매칭 대기 중이에요</p>
                  <p className="text-xs text-stone-400 mt-0.5">코트가 배정되면 여기서 바로 보여드릴게요.</p>
                </div>
                <a href="./match.html" className="text-xs font-bold shrink-0" style={{ color: "var(--bc-blue)" }}>
                  매칭 화면 →
                </a>
              </div>
            )}
          </div>
        </section>
      )}

      {/* ③ 모임 현황 — 작은 카드 4개 */}
      {isRealToday && attendCount > 0 && (
        <section className="px-5 max-w-2xl mx-auto mb-4">
          <div className="grid grid-cols-4 gap-2">
            <div className="bc-card p-3 text-center">
              <p className="headfont text-xl text-stone-800">{attendCount}</p>
              <p className="text-[10px] text-stone-400 mt-0.5">참석자</p>
            </div>
            <div className="bc-card p-3 text-center">
              <p className="headfont text-xl" style={{ color: "var(--bc-blue)" }}>{occupiedIds.size}</p>
              <p className="text-[10px] text-stone-400 mt-0.5">게임 중</p>
            </div>
            <div className="bc-card p-3 text-center">
              <p className="headfont text-xl" style={{ color: "var(--bc-orange)" }}>{waitingNow.length}</p>
              <p className="text-[10px] text-stone-400 mt-0.5">대기자</p>
            </div>
            <div className="bc-card p-3 text-center">
              <p className="headfont text-xl text-stone-800">{activeCourts}</p>
              <p className="text-[10px] text-stone-400 mt-0.5">코트 수</p>
            </div>
          </div>
        </section>
      )}

      {/* ④ 최근 경기 + ⑤ 내 기록 */}
      {myId && myLifetimeStats && (
        <section className="px-5 max-w-2xl mx-auto mb-4">
          <div className="bc-card p-4">
            <div className="flex items-center justify-between mb-3">
              <p className="text-[11px] font-semibold text-stone-400 tracking-wide">🙋 내 기록</p>
              {myTier && (
                <span className="bc-badge2" style={{ backgroundColor: "var(--bc-blue)", color: "var(--bc-navy)" }}>
                  {myStage === "provisional0" ? "🆕 평가중" : myStage === "provisional1" ? "🟡 임시급수" : `${myTier}급`}
                </span>
              )}
            </div>
            <div className="grid grid-cols-4 gap-2 text-center mb-3">
              <div>
                <p className="scorefont text-lg font-bold text-stone-800">{Math.round(mySkillScore)}</p>
                <p className="text-[10px] text-stone-400 mt-0.5">실력점수</p>
              </div>
              <div>
                <p className="scorefont text-lg font-bold text-stone-800">{myTier || "-"}</p>
                <p className="text-[10px] text-stone-400 mt-0.5">급수</p>
              </div>
              <div>
                <p className="scorefont text-lg font-bold" style={{ color: "var(--bc-blue)" }}>{myWinRate}%</p>
                <p className="text-[10px] text-stone-400 mt-0.5">승률</p>
              </div>
              <div>
                <p className="scorefont text-lg font-bold text-stone-800">{myLifetimeStats.games}</p>
                <p className="text-[10px] text-stone-400 mt-0.5">총 경기</p>
              </div>
            </div>
            {myRecentMatches.length > 0 && (
              <div className="pt-3 border-t" style={{ borderColor: "var(--bc-line)" }}>
                <p className="text-[11px] text-stone-400 mb-2">최근 경기</p>
                <div className="flex gap-2">
                  {myRecentMatches.map((m) => (
                    <span
                      key={m.id}
                      className="bc-badge2"
                      style={m.won ? { backgroundColor: "#DCFCE7", color: "#16A34A" } : { backgroundColor: "#FEE2E2", color: "#DC2626" }}
                    >
                      {m.won ? "승리" : "패배"}
                    </span>
                  ))}
                </div>
              </div>
            )}
            <a href="./match.html" className="block text-center text-xs font-semibold mt-3" style={{ color: "var(--bc-blue)" }}>
              전체 기록 보기 →
            </a>
          </div>
        </section>
      )}

      {/* 오늘의 한마디 */}
      <section className="px-5 max-w-2xl mx-auto mb-8 flex items-center justify-center gap-1.5 text-center">
        <span className="text-xs">🏸</span>
        <p className="text-xs text-stone-400">오늘도 좋은 경기 되세요!</p>
      </section>

      <BottomNav active="home" />
      <AppModalHost />
    </div>
  );
}

window.authReadyPromise.then(() => {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script>
</body>
</html>
